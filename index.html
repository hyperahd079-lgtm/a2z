<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A2Z HYPERMARKET</title>
    <!-- مكتبة ZXing الرسمية والسريعة جداً -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #090514;
            background-image: radial-gradient(circle at 50% 10%, rgba(189, 0, 255, 0.15), transparent 60%);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            color: #ffffff; min-height: 100vh;
        }

        .logo-container { margin-bottom: 25px; margin-top: 15px; }
        .logo-container img { 
            width: 110px; border-radius: 20px; background: #ffffff; padding: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        /* إطار الكاميرا الأنيق */
        .camera-wrapper { 
            width: 100%; max-width: 350px; 
            height: 250px; position: relative; 
            border-radius: 24px; border: 2px solid rgba(189, 0, 255, 0.4);
            overflow: hidden; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
        }

        /* فيديو الكاميرا المباشر والمضبوط 100% */
        #webcam-video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none;
            border-radius: 20px;
        }

        .camera-start-card { text-align: center; padding: 20px; z-index: 5; }
        .camera-start-card p { font-size: 0.95rem; color: #b3a2ce; margin-bottom: 18px; }

        #start-cam-btn {
            background: linear-gradient(135deg, #ff007f 0%, #bd00ff 100%);
            color: white; border: none; padding: 14px 30px; border-radius: 50px;
            font-size: 1.05rem; font-weight: bold; cursor: pointer; 
            box-shadow: 0 6px 20px rgba(189, 0, 255, 0.4);
            transition: transform 0.2s;
        }

        #start-cam-btn:active { transform: scale(0.96); }

        .laser-line {
            display: none; position: absolute; top: 15%; left: 5%; width: 90%; height: 3px;
            background: #ff007f; box-shadow: 0 0 12px #ff007f, 0 0 20px #ff007f;
            animation: scan 2s infinite ease-in-out; z-index: 10; border-radius: 50%;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 15%; }
            50% { top: 80%; }
            100% { top: 15%; }
        }

        .manual-search-container {
            width: 100%; max-width: 350px; margin-top: 25px;
            display: flex; gap: 10px; background: rgba(255, 255, 255, 0.05); 
            padding: 6px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .manual-input {
            flex: 1; padding: 12px 18px; border-radius: 50px;
            border: none; background: transparent; color: white;
            font-size: 0.95rem; outline: none;
        }

        .manual-input::placeholder { color: #7f789e; }

        .manual-btn {
            background: #bd00ff; color: white; border: none; padding: 10px 22px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
        }

        #result-container {
            display: none; width: 100%; max-width: 350px; padding: 25px;
            background: rgba(255, 255, 255, 0.05); border-radius: 24px; text-align: center;
            margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .item-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; color: #e2d9f3; }
        .price-tag { font-size: 2.3rem; color: #ffe259; font-weight: 800; margin-bottom: 20px; text-shadow: 0 0 15px rgba(255, 226, 89, 0.3); }
        .action-btn {
            background: #ffffff; color: #090514; border: none; padding: 14px 20px;
            border-radius: 50px; font-weight: bold; width: 100%; font-size: 1rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://lh3.googleusercontent.com/d/109H2w4zxFrJzi5EgQse4u1Ka6KoZyupo" alt="A2Z Hypermarket">
    </div>

    <div class="camera-wrapper" id="camera-box">
        <div class="camera-start-card" id="start-card">
            <p>افحص سعر أي مادة فوراً</p>
            <button id="start-cam-btn" onclick="initScanner()">
                📷 فتح الكاميرا للمسح
            </button>
        </div>
        
        <!-- فيديو الكاميرا الصريح والمستقر -->
        <video id="webcam-video" playsinline muted></video>
        <div class="laser-line" id="laser"></div>
    </div>

    <div class="manual-search-container">
        <input type="text" id="manual-barcode-input" class="manual-input" placeholder="أدخل رقم الباركود يدويًا..." pattern="[0-9]*">
        <button class="manual-btn" onclick="searchManualBarcode()">بحث</button>
    </div>
    
    <div id="result-container">
        <div class="item-name" id="item-name">---</div>
        <div class="price-tag" id="item-price">---</div>
        <button class="action-btn" onclick="resetScanner()">مسح مادة أخرى</button>
    </div>

    <script>
        let codeReader;
        let securedDataStore = new Map(); 
        
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeJYj6R_5RlsJthru-BMtrHaKz_08pFgwVWqY9ApT4sBKNzXgPO9iF7wxA8LRJJjJFVA/exec"; 

        // تحضير البيانات خلف الكواليس
        window.onload = function() {
            const cbName = "jsonp_init_" + Math.round(Math.random() * 1000000);
            window[cbName] = function(rawData) {
                if (typeof rawData === "object") {
                    for (const [barcode, info] of Object.entries(rawData)) {
                        securedDataStore.set(String(barcode).trim(), info);
                    }
                }
                delete window[cbName];
                document.getElementById(cbName)?.remove();
            };

            const script = document.createElement('script');
            script.id = cbName;
            script.src = `${GOOGLE_SCRIPT_URL}?callback=${cbName}`;
            document.body.appendChild(script);
        };

        function initScanner() {
            document.getElementById('start-card').style.display = 'none';
            const videoElem = document.getElementById('webcam-video');
            videoElem.style.display = 'block';

            if (!codeReader) {
                codeReader = new ZXing.BrowserMultiFormatReader();
            }

            // تشغيل الكاميرا الخلفية فوراً بدون مشاكل أبعاد
            codeReader.decodeFromVideoDevice(undefined, 'webcam-video', (result, err) => {
                if (result) {
                    handleResult(result.text);
                }
            }).then(() => {
                document.getElementById('laser').style.display = 'block';
            }).catch(err => {
                alert("يرجى السماح بفتح الكاميرا من إعدادات المتصفح.");
                document.getElementById('start-card').style.display = 'block';
                videoElem.style.display = 'none';
                document.getElementById('laser').style.display = 'none';
            });
        }

        function handleResult(barcode) {
            // إيقاف الكاميرا فوراً عند المسح
            if (codeReader) {
                codeReader.reset();
            }
            
            document.getElementById('laser').style.display = 'none';
            document.getElementById('webcam-video').style.display = 'none';
            document.getElementById('camera-box').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';

            const cleanBarcode = String(barcode).trim();
            const item = securedDataStore.get(cleanBarcode);

            if(item) {
                document.getElementById('item-name').innerText = item.n;
                document.getElementById('item-price').innerText = Number(item.p).toLocaleString() + " د.ع";
            } else {
                document.getElementById('item-name').innerText = "غير موجود في النظام";
                document.getElementById('item-price').innerText = "---";
            }
        }

        function searchManualBarcode() {
            const barcode = document.getElementById('manual-barcode-input').value.trim();
            if (barcode) {
                handleResult(barcode);
                document.getElementById('manual-barcode-input').value = '';
            }
        }

        function resetScanner() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('camera-box').style.display = 'flex';
            document.getElementById('start-card').style.display = 'none';
            initScanner();
        }
    </script>
</body>
</html>
