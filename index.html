<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A2Z HYPERMARKET - فحص الأسعار</title>
    <!-- مكتبة ZXing للباركود -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <!-- خط Cairo الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b0f17;
            --surface-glass: rgba(22, 27, 38, 0.65);
            --surface-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #10b981;
            --brand-gold: #fbbf24;
            --brand-orange: #f97316;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Cairo', sans-serif;
            margin: 0; padding: 0;
        }
        
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 20% 15%, rgba(249, 115, 22, 0.12) 0px, transparent 45%),
                radial-gradient(at 80% 85%, rgba(16, 185, 129, 0.12) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(59, 130, 246, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between;
            color: var(--text-main); 
            padding: 20px 16px;
            overflow: hidden;
        }

        /* --- الهيدر واللوغو --- */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
            z-index: 2;
        }

        .logo-box-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floating 3s ease-in-out infinite;
        }

        .logo-box-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-gold), var(--brand-orange), var(--primary-accent));
            background-size: 200% 200%;
            animation: gradientBorder 4s ease infinite;
            z-index: 1;
            filter: blur(4px);
            opacity: 0.8;
        }

        .logo-box-inner {
            position: absolute;
            inset: 1px;
            background: #ffffff;
            border-radius: 27px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo-box-inner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .app-title {
            font-size: 1.1rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #ffffff 30%, var(--brand-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-top: 12px;
            text-transform: uppercase;
        }

        .app-subtitle {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 2px;
        }

        /* --- إطار الكاميرا الذكي --- */
        .camera-wrapper { 
            width: 100%; 
            max-width: 360px; 
            height: 250px; 
            position: relative; 
            border-radius: 24px; 
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            z-index: 2;
        }

        /* زوايا استهداف الماسح (Target Reticle) */
        .scanner-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid var(--brand-gold);
            z-index: 12;
            pointer-events: none;
            transition: border-color 0.3s ease;
        }
        .corner-tl { top: 15px; left: 15px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
        .corner-tr { top: 15px; right: 15px; border-left: none; border-bottom: none; border-top-right-radius: 8px; }
        .corner-bl { bottom: 15px; left: 15px; border-right: none; border-top: none; border-bottom-left-radius: 8px; }
        .corner-br { bottom: 15px; right: 15px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }

        #webcam-video { 
            width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 22px;
        }

        .camera-start-card { 
            text-align: center; 
            padding: 20px; 
            z-index: 5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .camera-start-card p { 
            font-size: 0.85rem; 
            color: var(--text-sub); 
            font-weight: 600; 
            line-height: 1.4;
        }

        #start-cam-btn {
            background: linear-gradient(135deg, var(--brand-orange) 0%, var(--brand-gold) 100%);
            color: #ffffff; 
            border: none; 
            padding: 12px 26px; 
            border-radius: 50px;
            font-size: 0.9rem; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.35);
            transition: all 0.25s ease;
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
        }

        #start-cam-btn:active { transform: scale(0.96); }

        #torch-btn {
            display: none; 
            position: absolute; 
            top: 15px; 
            left: 15px;
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; 
            border-radius: 50px; 
            padding: 6px 14px; 
            font-size: 0.75rem; 
            font-weight: 700;
            cursor: pointer; 
            z-index: 20; 
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .laser-line {
            display: none; 
            position: absolute; 
            top: 20%; 
            left: 8%; 
            width: 84%; 
            height: 2px;
            background: var(--primary-accent); 
            box-shadow: 0 0 15px var(--primary-accent), 0 0 25px var(--primary-accent);
            animation: scan 2.2s infinite ease-in-out; 
            z-index: 10; 
            border-radius: 100px;
            pointer-events: none;
        }

        /* --- البحث اليدوي --- */
        .manual-search-container {
            width: 100%; 
            max-width: 360px; 
            display: flex; 
            gap: 8px; 
            background: var(--surface-glass); 
            padding: 6px 8px 6px 14px; 
            border-radius: 50px; 
            border: 1px solid var(--surface-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .manual-input {
            flex: 1; 
            border: none; 
            background: transparent; 
            color: var(--text-main);
            font-size: 0.88rem; 
            outline: none;
            font-weight: 600;
        }

        .manual-input::placeholder { color: var(--text-sub); opacity: 0.7; }

        .manual-btn {
            background: linear-gradient(135deg, var(--brand-orange) 0%, var(--brand-gold) 100%); 
            color: #ffffff; 
            border: none; 
            padding: 9px 20px;
            border-radius: 50px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            transition: transform 0.2s ease;
        }

        .manual-btn:active { transform: scale(0.95); }

        /* --- بطاقة النتيجة (Result Card) --- */
        #result-container {
            display: none; 
            width: 100%; 
            max-width: 360px; 
            padding: 28px 20px 20px;
            background: var(--surface-glass); 
            border-radius: 28px; 
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            animation: popup 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary-accent);
            font-size: 1.5rem;
            margin-bottom: 12px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .item-name { 
            font-size: 1.15rem; 
            font-weight: 800; 
            margin-bottom: 16px; 
            color: var(--text-main); 
            line-height: 1.35; 
        }

        .price-box { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; 
            padding: 16px; 
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .price-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .price-tag { 
            font-size: 2.3rem; 
            color: var(--brand-gold); 
            font-weight: 900; 
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.25); 
            font-variant-numeric: tabular-nums;
        }
        
        .action-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: #ffffff; 
            border: none; 
            padding: 14px 24px;
            border-radius: 50px; 
            font-weight: 800; 
            width: 100%; 
            font-size: 0.95rem; 
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
            transition: all 0.2s ease;
        }

        .action-btn:active { transform: scale(0.97); }

        /* --- الأنيميشن والتأثيرات --- */
        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes scan {
            0% { top: 15%; opacity: 0.3; }
            50% { top: 80%; opacity: 1; }
            100% { top: 15%; opacity: 0.3; }
        }

        @keyframes popup {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- الهيدر واللوغو المطور -->
    <div class="header-container">
        <div class="logo-box-wrapper">
            <div class="logo-box-inner">
                <img src="https://lh3.googleusercontent.com/d/109H2w4zxFrJzi5EgQse4u1Ka6KoZyupo" alt="A2Z Hypermarket">
            </div>
        </div>
        <div class="app-title">A2Z HYPERMARKET</div>
        <div class="app-subtitle">ماسح الأسعار الذكي</div>
    </div>

    <!-- إطار الكاميرا بتصميم الزوايا الذكية -->
    <div class="camera-wrapper" id="camera-box">
        <div class="scanner-corner corner-tl"></div>
        <div class="scanner-corner corner-tr"></div>
        <div class="scanner-corner corner-bl"></div>
        <div class="scanner-corner corner-br"></div>

        <button id="torch-btn" onclick="toggleTorch()">⚡ الفلاش</button>

        <div class="camera-start-card" id="start-card">
            <p>وجه كاميرا الجهاز نحو الباركود لفحص السعر مباشرة</p>
            <button id="start-cam-btn" onclick="initScanner()">
                📷 تشغيل الكاميرا للمسح
            </button>
        </div>
        
        <video id="webcam-video" playsinline muted></video>
        <div class="laser-line" id="laser"></div>
    </div>

    <!-- البحث اليدوي -->
    <div class="manual-search-container" id="manual-box">
        <input type="text" id="manual-barcode-input" class="manual-input" placeholder="أدخل رقم الباركود يدويًا..." pattern="[0-9]*">
        <button class="manual-btn" onclick="searchManualBarcode()">بحث</button>
    </div>
    
    <!-- واجهة النتيجة العصرية -->
    <div id="result-container">
        <div class="result-badge" id="result-icon">✓</div>
        <div class="item-name" id="item-name">---</div>
        <div class="price-box">
            <div class="price-label">السعر الإجمالي</div>
            <div class="price-tag" id="item-price">---</div>
        </div>
        <button class="action-btn" onclick="resetScanner()">🔄 مسح مادة أخرى</button>
    </div>

    <script>
        let codeReader;
        let securedDataStore = new Map(); 
        let canScan = true; 
        let torchOn = false;
        let videoTrack = null;
        
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeJYj6R_5RlsJthru-BMtrHaKz_08pFgwVWqY9ApT4sBKNzXgPO9iF7wxA8LRJJjJFVA/exec"; 

        window.onload = function() {
            const cbName = "jsonp_init_" + Math.round(Math.random() * 1000000);
            window[cbName] = function(rawData) {
                if (typeof rawData === "object") {
                    for (const [barcode, info] of Object.entries(rawData)) {
                        securedDataStore.set(String(barcode).trim(), info);
                    }
                }
                delete window[cbName];
                document.getElementById(cbName)?.remove();
            };

            const script = document.createElement('script');
            script.id = cbName;
            script.src = `${GOOGLE_SCRIPT_URL}?callback=${cbName}`;
            document.body.appendChild(script);
        };

        function playCashierBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(2400, audioCtx.currentTime); 
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch(e) {
                console.log("Audio not supported", e);
            }
        }

        function initScanner() {
            document.getElementById('start-card').style.display = 'none';
            const videoElem = document.getElementById('webcam-video');
            videoElem.style.display = 'block';

            if (!codeReader) {
                const hints = new Map();
                const formats = [
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.EAN_8,
                    ZXing.BarcodeFormat.CODE_128,
                    ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E,
                    ZXing.BarcodeFormat.CODE_39
                ];
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
                codeReader = new ZXing.BrowserMultiFormatReader(hints);
            }

            canScan = true;

            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            codeReader.decodeFromConstraints(constraints, 'webcam-video', (result, err) => {
                if (result && canScan) {
                    canScan = false; 
                    handleResult(result.text);
                }
            }).then(() => {
                document.getElementById('laser').style.display = 'block';
                
                setTimeout(() => {
                    const stream = videoElem.srcObject;
                    if (stream) {
                        videoTrack = stream.getVideoTracks()[0];
                        if (videoTrack && videoTrack.getCapabilities && videoTrack.getCapabilities().torch) {
                            document.getElementById('torch-btn').style.display = 'block';
                        }
                    }
                }, 600);

            }).catch(err => {
                console.error(err);
                alert("يرجى السماح بفتح الكاميرا من إعدادات المتصفح.");
                document.getElementById('start-card').style.display = 'flex';
                videoElem.style.display = 'none';
                document.getElementById('laser').style.display = 'none';
            });
        }

        async function toggleTorch() {
            if (!videoTrack) return;
            try {
                torchOn = !torchOn;
                await videoTrack.applyConstraints({
                    advanced: [{ torch: torchOn }]
                });
                const torchBtn = document.getElementById('torch-btn');
                torchBtn.style.background = torchOn ? '#fbbf24' : 'rgba(0, 0, 0, 0.5)';
                torchBtn.style.color = torchOn ? '#000000' : '#ffffff';
            } catch (e) {
                console.error("الفلاش غير مدعوم على هذا الجهاز:", e);
            }
        }

        function handleResult(barcode) {
            if (navigator.vibrate) {
                navigator.vibrate(150);
            }

            playCashierBeep();

            if (torchOn && videoTrack) {
                torchOn = false;
                videoTrack.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
            }
            document.getElementById('torch-btn').style.display = 'none';

            if (codeReader) {
                codeReader.reset();
            }
            
            document.getElementById('camera-box').style.display = 'none';
            document.getElementById('manual-box').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';

            const cleanBarcode = String(barcode).trim();
            const item = securedDataStore.get(cleanBarcode);

            const badgeElem = document.getElementById('result-icon');
            if(item) {
                badgeElem.innerText = '✓';
                badgeElem.style.background = 'rgba(16, 185, 129, 0.15)';
                badgeElem.style.color = '#10b981';
                badgeElem.style.borderColor = 'rgba(16, 185, 129, 0.3)';

                document.getElementById('item-name').innerText = item.n;
                document.getElementById('item-price').innerText = Number(item.p).toLocaleString() + " د.ع";
            } else {
                badgeElem.innerText = '✕';
                badgeElem.style.background = 'rgba(239, 68, 68, 0.15)';
                badgeElem.style.color = '#ef4444';
                badgeElem.style.borderColor = 'rgba(239, 68, 68, 0.3)';

                document.getElementById('item-name').innerText = "عذراً، هذا المنتج غير موجود في النظام";
                document.getElementById('item-price').innerText = "---";
            }
        }

        function searchManualBarcode() {
            const barcode = document.getElementById('manual-barcode-input').value.trim();
            if (barcode) {
                handleResult(barcode);
                document.getElementById('manual-barcode-input').value = '';
            }
        }

        function resetScanner() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('camera-box').style.display = 'flex';
            document.getElementById('manual-box').style.display = 'flex';
            document.getElementById('manual-barcode-input').value = '';
            initScanner();
        }
    </script>
</body>
</html>
