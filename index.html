<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A2Z HYPERMARKET</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #06020f;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            color: #ffffff; min-height: 100vh;
        }
        .logo-container { margin-bottom: 20px; }
        .logo-container img { width: 100px; border-radius: 20px; background: white; padding: 5px; }
        
        .camera-wrapper { width: 100%; max-width: 340px; position: relative; }
        #reader {
            width: 100% !important; 
            background: #000;
            border-radius: 20px; 
            border: 2px solid #bd00ff;
            min-height: 250px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(189, 0, 255, 0.3);
        }
        #reader video { width: 100% !important; object-fit: cover; border-radius: 18px; }
        
        #ios-start-btn {
            background: linear-gradient(135deg, #ff007f 0%, #bd00ff 100%);
            color: white; border: none; padding: 15px 30px; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; 
            box-shadow: 0 5px 15px rgba(255,0,127,0.3);
            transition: transform 0.2s;
        }
        #ios-start-btn:active { transform: scale(0.95); }

        /* البحث اليدوي */
        .manual-search-container {
            width: 100%; max-width: 340px; margin-top: 15px;
            display: flex; gap: 8px;
        }
        .manual-input {
            flex: 1; padding: 12px 15px; border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
            color: white; font-size: 1rem; text-align: center; outline: none;
        }
        .manual-input::placeholder { color: #8a8a9e; }
        .manual-btn {
            background: #bd00ff; color: white; border: none; padding: 12px 20px;
            border-radius: 25px; font-weight: bold; cursor: pointer;
        }

        #result-container {
            display: none; width: 100%; max-width: 340px; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 20px; text-align: center;
            margin-top: 15px; border: 1px solid rgba(255,255,255,0.1);
        }
        .item-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        .price-tag { font-size: 2.2rem; color: #ffe259; font-weight: 800; margin-bottom: 15px; }
        .action-btn {
            background: #ffffff; color: #06020f; border: none; padding: 12px 20px;
            border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://lh3.googleusercontent.com/d/109H2w4zxFrJzi5EgQse4u1Ka6KoZyupo" alt="A2Z">
    </div>

    <div class="camera-wrapper">
        <div id="reader">
            <button id="ios-start-btn" onclick="initScanner()">ابدأ فحص الباركود 📷</button>
        </div>
    </div>

    <!-- حقل البحث اليدوي -->
    <div class="manual-search-container">
        <input type="text" id="manual-barcode-input" class="manual-input" placeholder="أدخل رقم الباركود يدويًا..." pattern="[0-9]*">
        <button class="manual-btn" onclick="searchManualBarcode()">بحث</button>
    </div>
    
    <div id="result-container">
        <div class="item-name" id="item-name">جاري الفحص...</div>
        <div class="price-tag" id="item-price">---</div>
        <button class="action-btn" onclick="resetScanner()">مسح مادة أخرى</button>
    </div>

    <script>
        let html5QrCode;
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzt9kOh9XqbD_ymqeMZXOAULriQGXMi6pFoOcrEGJZc7Vs6OlliUH7D_GJzDT_XQIKkw/exec"; 

        function initScanner() {
            document.getElementById('ios-start-btn').style.display = 'none';
            html5QrCode = new Html5Qrcode("reader");
            
            // إعدادات عالية الدقة وقوة تركيز أسرع لجميع أشكال الباركود
            const config = { 
                fps: 25, 
                qrbox: { width: 250, height: 150 },
                aspectRatio: 1.0,
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
            };

            const videoConstraints = {
                facingMode: "environment",
                width: { min: 640, ideal: 1280, max: 1920 },
                height: { min: 480, ideal: 720, max: 1080 },
                focusMode: "continuous"
            };

            html5QrCode.start(
                videoConstraints, 
                config,
                (decodedText) => {
                    handleResult(decodedText);
                }
            ).catch(err => {
                alert("يرجى التأكد من السماح للكاميرا بالعمل.");
                document.getElementById('ios-start-btn').style.display = 'block';
            });
        }

        async function fetchItemData(barcode) {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=check&barcode=${barcode}`);
                const data = await response.json();
                return data;
            } catch (error) {
                // دعم ثانوي في حال وجود تقييدات CORS في بيئة Apps Script
                return new Promise((resolve) => {
                    const cb = "cb_" + Date.now();
                    window[cb] = (res) => {
                        resolve(res);
                        delete window[cb];
                        document.getElementById(cb)?.remove();
                    };
                    const s = document.createElement('script');
                    s.id = cb;
                    s.src = `${GOOGLE_SCRIPT_URL}?action=check&barcode=${barcode}&callback=${cb}`;
                    document.body.appendChild(s);
                });
            }
        }

        async function handleResult(barcode) {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.pause();
            }
            
            document.getElementById('reader').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('item-name').innerText = "جاري جلب البيانات...";
            document.getElementById('item-price').innerText = "---";

            const res = await fetchItemData(barcode);

            if(res && res.found) {
                document.getElementById('item-name').innerText = res.name;
                document.getElementById('item-price').innerText = Number(res.price).toLocaleString() + " د.ع";
            } else {
                document.getElementById('item-name').innerText = "غير موجود";
                document.getElementById('item-price').innerText = "---";
            }
        }

        function searchManualBarcode() {
            const input = document.getElementById('manual-barcode-input');
            const barcode = input.value.trim();
            if (barcode) {
                handleResult(barcode);
                input.value = '';
            }
        }

        function resetScanner() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('reader').style.display = 'flex';
            if (html5QrCode) {
                html5QrCode.resume();
            }
        }
    </script>
</body>
</html>
