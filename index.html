<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A2Z HYPERMARKET - فحص الأسعار</title>
    <!-- مكتبة ZXing للباركود -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <!-- خط Cairo الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Cairo', sans-serif; }
        
        body {
            background: #06030d;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(189, 0, 255, 0.2), transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(255, 0, 127, 0.1), transparent 40%);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            color: #ffffff; min-height: 100vh;
        }

        /* حاوية اللوغو المصغرة مع الضوء المتحرك والنبض */
        .logo-box-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            margin-top: 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseLogo 2s ease-in-out infinite;
        }

        /* الإطار الضوئي المتحرك (نقطة ضوء تدور داير ما داير اللوغو بشكل أصغر وأدق) */
        .logo-box-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: conic-gradient(from 0deg, transparent 65%, #ff007f 85%, #ffe259 100%);
            animation: rotateLight 2s linear infinite;
            z-index: 1;
        }

        .logo-box-inner {
            position: absolute;
            inset: 2px;
            background: #ffffff;
            border-radius: 18px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 0 6px 20px rgba(189, 0, 255, 0.4);
        }

        .logo-box-inner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes rotateLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .app-title {
            font-size: 1.1rem; font-weight: 700; color: #d4b8ff; margin-bottom: 20px; letter-spacing: 1px;
        }
        
        /* إطار الكاميرا الأنيق بأقصى جودة */
        .camera-wrapper { 
            width: 100%; max-width: 360px; 
            height: 280px; position: relative; 
            border-radius: 28px; border: 2px solid rgba(189, 0, 255, 0.5);
            overflow: hidden; background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(189, 0, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }

        #webcam-video { 
            width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 26px;
        }

        .camera-start-card { text-align: center; padding: 25px; z-index: 5; }
        .camera-start-card p { font-size: 1rem; color: #d0c2e8; margin-bottom: 20px; font-weight: 600; }

        #start-cam-btn {
            background: linear-gradient(135deg, #ff007f 0%, #bd00ff 100%);
            color: white; border: none; padding: 16px 35px; border-radius: 50px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; 
            box-shadow: 0 8px 25px rgba(189, 0, 255, 0.5);
            transition: all 0.3s ease;
            display: inline-flex; align-items: center; gap: 8px;
        }
        #start-cam-btn:active { transform: scale(0.95); box-shadow: 0 4px 15px rgba(189, 0, 255, 0.3); }

        /* زر الفلاش */
        #torch-btn {
            display: none; position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; border-radius: 50px; padding: 8px 16px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; z-index: 20; backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .laser-line {
            display: none; position: absolute; top: 15%; left: 5%; width: 90%; height: 3px;
            background: #ff007f; box-shadow: 0 0 15px #ff007f, 0 0 25px #ff007f;
            animation: scan 2s infinite ease-in-out; z-index: 10; border-radius: 50%;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }

        .manual-search-container {
            width: 100%; max-width: 360px; 
            display: flex; gap: 10px; background: rgba(255, 255, 255, 0.04); 
            padding: 8px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .manual-input {
            flex: 1; padding: 12px 20px; border-radius: 50px;
            border: none; background: transparent; color: white;
            font-size: 1rem; outline: none;
        }

        .manual-input::placeholder { color: #8c82ab; }

        .manual-btn {
            background: linear-gradient(135deg, #7928ca 0%, #4300b0 100%); 
            color: white; border: none; padding: 10px 24px;
            border-radius: 50px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
            transition: transform 0.2s;
        }
        .manual-btn:active { transform: scale(0.96); }

        #result-container {
            display: none; width: 100%; max-width: 360px; padding: 30px 20px;
            background: rgba(255, 255, 255, 0.06); border-radius: 28px; text-align: center;
            margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .item-name { font-size: 1.35rem; font-weight: 700; margin-bottom: 15px; color: #f3eeff; line-height: 1.4; }
        .price-box { 
            background: rgba(255, 226, 89, 0.08); border: 1px solid rgba(255, 226, 89, 0.3);
            border-radius: 20px; padding: 15px; margin-bottom: 25px;
        }
        .price-label { font-size: 0.85rem; color: #c4b6e8; margin-bottom: 5px; }
        .price-tag { font-size: 2.5rem; color: #ffe259; font-weight: 900; text-shadow: 0 0 20px rgba(255, 226, 89, 0.4); }
        
        .action-btn {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); color: #06030d; border: none; padding: 15px 20px;
            border-radius: 50px; font-weight: 800; width: 100%; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.4);
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="logo-box-wrapper">
        <div class="logo-box-inner">
            <img src="https://lh3.googleusercontent.com/d/109H2w4zxFrJzi5EgQse4u1Ka6KoZyupo" alt="A2Z Hypermarket">
        </div>
    </div>
    <div class="app-title">A2Z HYPERMARKET</div>

    <div class="camera-wrapper" id="camera-box">
        <button id="torch-btn" onclick="toggleTorch()">⚡ فلاش</button>
        <div class="camera-start-card" id="start-card">
            <p>افحص سعر أي مادة فوراً عبر الباركود</p>
            <button id="start-cam-btn" onclick="initScanner()">
                📷 فتح الكاميرا للمسح
            </button>
        </div>
        
        <video id="webcam-video" playsinline muted></video>
        <div class="laser-line" id="laser"></div>
    </div>

    <div class="manual-search-container">
        <input type="text" id="manual-barcode-input" class="manual-input" placeholder="أدخل رقم الباركود يدويًا..." pattern="[0-9]*">
        <button class="manual-btn" onclick="searchManualBarcode()">بحث</button>
    </div>
    
    <div id="result-container">
        <div class="result-icon" id="result-icon">🏷️</div>
        <div class="item-name" id="item-name">---</div>
        <div class="price-box">
            <div class="price-label">السعر الإجمالي</div>
            <div class="price-tag" id="item-price">---</div>
        </div>
        <button class="action-btn" onclick="resetScanner()">🔄 مسح مادة أخرى</button>
    </div>

    <script>
        let codeReader;
        let securedDataStore = new Map(); 
        let canScan = true; 
        let torchOn = false;
        let videoTrack = null;
        
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeJYj6R_5RlsJthru-BMtrHaKz_08pFgwVWqY9ApT4sBKNzXgPO9iF7wxA8LRJJjJFVA/exec"; 

        window.onload = function() {
            const cbName = "jsonp_init_" + Math.round(Math.random() * 1000000);
            window[cbName] = function(rawData) {
                if (typeof rawData === "object") {
                    for (const [barcode, info] of Object.entries(rawData)) {
                        securedDataStore.set(String(barcode).trim(), info);
                    }
                }
                delete window[cbName];
                document.getElementById(cbName)?.remove();
            };

            const script = document.createElement('script');
            script.id = cbName;
            script.src = `${GOOGLE_SCRIPT_URL}?callback=${cbName}`;
            document.body.appendChild(script);
        };

        // صوت الكاشير الحاد والسريع (Beep)
        function playCashierBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'square'; // صوت رقمي حاد يشبه جهاز الباركود
                oscillator.frequency.setValueAtTime(2400, audioCtx.currentTime); 
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08); // مدة قصيرة جداً (80 ميلي ثانية)
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch(e) {
                console.log("Audio not supported", e);
            }
        }

        function initScanner() {
            document.getElementById('start-card').style.display = 'none';
            const videoElem = document.getElementById('webcam-video');
            videoElem.style.display = 'block';

            if (!codeReader) {
                // قصر البحث حصراً على باركودات المنتجات (EAN, UPC, Code 128) وتجاهل أي شيء آخر
                const hints = new Map();
                const formats = [
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.EAN_8,
                    ZXing.BarcodeFormat.CODE_128,
                    ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E,
                    ZXing.BarcodeFormat.CODE_39
                ];
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
                codeReader = new ZXing.BrowserMultiFormatReader(hints);
            }

            canScan = true;

            // ضبط الكاميرا على أعلى دقة (1080p) لضمان السرعة والدقة الفائقة في قراءة الباركود
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            codeReader.decodeFromConstraints(constraints, 'webcam-video', (result, err) => {
                if (result && canScan) {
                    canScan = false; 
                    handleResult(result.text);
                }
            }).then(() => {
                document.getElementById('laser').style.display = 'block';
                
                setTimeout(() => {
                    const stream = videoElem.srcObject;
                    if (stream) {
                        videoTrack = stream.getVideoTracks()[0];
                        if (videoTrack && videoTrack.getCapabilities && videoTrack.getCapabilities().torch) {
                            document.getElementById('torch-btn').style.display = 'block';
                        }
                    }
                }, 600);

            }).catch(err => {
                console.error(err);
                alert("يرجى السماح بفتح الكاميرا من إعدادات المتصفح.");
                document.getElementById('start-card').style.display = 'block';
                videoElem.style.display = 'none';
                document.getElementById('laser').style.display = 'none';
            });
        }

        async function toggleTorch() {
            if (!videoTrack) return;
            try {
                torchOn = !torchOn;
                await videoTrack.applyConstraints({
                    advanced: [{ torch: torchOn }]
                });
                const torchBtn = document.getElementById('torch-btn');
                torchBtn.style.background = torchOn ? '#ffe259' : 'rgba(0, 0, 0, 0.6)';
                torchBtn.style.color = torchOn ? '#06030d' : 'white';
            } catch (e) {
                console.error("الفلاش غير مدعوم على هذا الجهاز:", e);
            }
        }

        function handleResult(barcode) {
            // اهتزاز الهاتف
            if (navigator.vibrate) {
                navigator.vibrate(150);
            }

            // تشغيل صوت الكاشير الحاد والسريع
            playCashierBeep();

            if (torchOn && videoTrack) {
                torchOn = false;
                videoTrack.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
            }
            document.getElementById('torch-btn').style.display = 'none';

            if (codeReader) {
                codeReader.reset();
            }
            
            document.getElementById('laser').style.display = 'none';
            document.getElementById('webcam-video').style.display = 'none';
            document.getElementById('camera-box').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';

            const cleanBarcode = String(barcode).trim();
            const item = securedDataStore.get(cleanBarcode);

            if(item) {
                document.getElementById('result-icon').innerText = '✅';
                document.getElementById('item-name').innerText = item.n;
                document.getElementById('item-price').innerText = Number(item.p).toLocaleString() + " د.ع";
            } else {
                document.getElementById('result-icon').innerText = '❌';
                document.getElementById('item-name').innerText = "غير موجود في النظام";
                document.getElementById('item-price').innerText = "---";
            }
        }

        function searchManualBarcode() {
            const barcode = document.getElementById('manual-barcode-input').value.trim();
            if (barcode) {
                handleResult(barcode);
                document.getElementById('manual-barcode-input').value = '';
            }
        }

        function resetScanner() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('camera-box').style.display = 'flex';
            document.getElementById('start-card').style.display = 'block';
            document.getElementById('manual-barcode-input').value = '';
        }
    </script>
</body>
</html>
