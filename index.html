<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A2Z HYPERMARKET</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #06020f;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            color: #ffffff; min-height: 100vh;
        }
        .logo-container { margin-bottom: 20px; }
        .logo-container img { width: 100px; border-radius: 20px; background: white; padding: 5px; }
        
        .camera-wrapper { width: 100%; max-width: 340px; position: relative; }
        #reader {
            width: 100% !important; background: rgba(255, 255, 255, 0.05);
            padding: 5px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            min-height: 250px; display: flex; align-items: center; justify-content: center;
        }
        #reader video { width: 100% !important; border-radius: 15px; }
        
        /* زر التنشيط للآيفون */
        #ios-start-btn {
            background: linear-gradient(135deg, #ff007f 0%, #bd00ff 100%);
            color: white; border: none; padding: 15px 30px; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(255,0,127,0.3);
        }

        #result-container {
            display: none; width: 100%; max-width: 340px; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 20px; text-align: center;
            margin-top: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .item-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        .price-tag { font-size: 2.2rem; color: #ffe259; font-weight: 800; margin-bottom: 15px; }
        .action-btn {
            background: #ffffff; color: #06020f; border: none; padding: 12px 20px;
            border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://lh3.googleusercontent.com/d/109H2w4zxFrJzi5EgQse4u1Ka6KoZyupo" alt="A2Z">
    </div>

    <div class="camera-wrapper">
        <div id="reader">
            <button id="ios-start-btn" onclick="initScanner()">ابدأ فحص الباركود 📷</button>
        </div>
    </div>
    
    <div id="result-container">
        <div class="item-name" id="item-name">جاري الفحص...</div>
        <div class="price-tag" id="item-price">0 د.ع</div>
        <button class="action-btn" onclick="resetScanner()">مسح مادة أخرى</button>
    </div>

    <script>
        let html5QrCode;
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzt9kOh9XqbD_ymqeMZXOAULriQGXMi6pFoOcrEGJZc7Vs6OlliUH7D_GJzDT_XQIKkw/exec"; 

        function initScanner() {
            document.getElementById('ios-start-btn').style.display = 'none';
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: 200 },
                (decodedText) => {
                    handleResult(decodedText);
                }
            ).catch(err => {
                alert("يرجى التأكد من السماح للكاميرا بالعمل.");
                document.getElementById('ios-start-btn').style.display = 'block';
            });
        }

        function handleResult(barcode) {
            html5QrCode.pause(); // إيقاف مؤقت لمنع المسح المتكرر
            document.getElementById('reader').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            
            const cb = "cb_" + Date.now();
            window[cb] = (res) => {
                if(res.found) {
                    document.getElementById('item-name').innerText = res.name;
                    document.getElementById('item-price').innerText = Number(res.price).toLocaleString() + " د.ع";
                } else {
                    document.getElementById('item-name').innerText = "غير موجود";
                    document.getElementById('item-price').innerText = "---";
                }
                delete window[cb];
                document.getElementById(cb)?.remove();
            };

            const s = document.createElement('script');
            s.id = cb;
            s.src = `${GOOGLE_SCRIPT_URL}?action=check&barcode=${barcode}&callback=${cb}`;
            document.body.appendChild(s);
        }

        function resetScanner() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('reader').style.display = 'flex';
            html5QrCode.resume();
        }
    </script>
</body>
</html>
